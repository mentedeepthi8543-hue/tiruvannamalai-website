<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Activities</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7fb;
}

.wrapper{
display:flex;
}

/* Sidebar */

.sidebar{
width:250px;
background:#0d6efd;
color:white;
height:100vh;
position:fixed;
padding-top:20px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar ul li{
padding:15px 25px;
}

.sidebar ul li:hover{
background:#084298;
}

.sidebar ul li.active{
background:white;
}

.sidebar ul li.active a{
color:#0d6efd;
font-weight:bold;
}

.sidebar ul li a{
color:white;
text-decoration:none;
display:block;
}

.main{
margin-left:250px;
padding:30px;
width:100%;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.card-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card-box h3{
font-size:35px;
color:#0d6efd;
}

.search-box,
.table-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:20px;
}

.badge-success{
background:#198754;
color:white;
padding:6px 12px;
border-radius:20px;
}

@media(max-width:768px){

.sidebar{
display:none;
}

.main{
margin-left:0;
}

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="wrapper">

<div class="sidebar">

<h2>🛕 Admin</h2>

<ul>

<li><a href="admin.html"><i class="fa fa-home"></i> Dashboard</a></li>

<li><a href="user-management.html"><i class="fa fa-users"></i> User Management</a></li>

<li><a href="login-history.html"><i class="fa fa-clock"></i> Login History</a></li>

<li class="active"><a href="#"><i class="fa fa-chart-line"></i> User Activities</a></li>

</ul>

</div>

<div class="main">

<div class="header">

<h2>User Activities</h2>

<button class="btn btn-danger" onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</button>

</div>

<div class="cards">

<div class="card-box">

<h3 id="totalActivities">0</h3>

<p>Total Activities</p>

</div>

<div class="card-box">

<h3 id="todayActivities">0</h3>

<p>Today's Activities</p>

</div>

<div class="card-box">

<h3 id="navigationCount">0</h3>

<p>Navigation Started</p>

</div>

<div class="card-box">

<h3 id="feedbackCount">0</h3>

<p>Feedback Submitted</p>

</div>

</div>

<div class="search-box">

<div class="row">

<div class="col-md-5">

<input
type="text"
id="search"
class="form-control"
placeholder="Search User">

</div>

<div class="col-md-3">

<select id="activityFilter" class="form-select">

<option value="">All Activities</option>

<option>Login</option>

<option>Viewed Temple</option>

<option>Started Navigation</option>

<option>Viewed Parking</option>

<option>Viewed Hotel</option>

<option>Submitted Feedback</option>

</select>

</div>

<div class="col-md-4 text-end">

<button class="btn btn-primary" onclick="searchActivity()">

<i class="fa fa-search"></i>

Search

</button>

<button class="btn btn-success" onclick="exportCSV()">

<i class="fa fa-file-export"></i>

Export CSV

</button>

</div>

</div>

</div>

<div class="table-box">

<h4>User Activity Records</h4>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>#</th>

<th>User</th>

<th>Activity</th>

<th>Date</th>

<th>Time</th>

<th>Status</th>

</tr>

</thead>

<tbody id="activityTable">
</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// =====================================
// SAMPLE ACTIVITY DATA
// =====================================

let activities=[

{
user:"Deepthi",
activity:"Login",
date:"29-07-2026",
time:"09:10 AM",
status:"Success"
},

{
user:"Rahul",
activity:"Viewed Temple",
date:"29-07-2026",
time:"09:30 AM",
status:"Completed"
},

{
user:"Priya",
activity:"Started Navigation",
date:"29-07-2026",
time:"10:05 AM",
status:"Completed"
},

{
user:"Kumar",
activity:"Viewed Parking",
date:"29-07-2026",
time:"10:40 AM",
status:"Completed"
},

{
user:"Deepthi",
activity:"Viewed Hotel",
date:"29-07-2026",
time:"11:20 AM",
status:"Completed"
},

{
user:"Rahul",
activity:"Submitted Feedback",
date:"29-07-2026",
time:"12:15 PM",
status:"Submitted"
}

];

// =====================================
// LOAD TABLE
// =====================================

function loadActivities(){

let table=document.getElementById("activityTable");

table.innerHTML="";

activities.forEach((item,index)=>{

table.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${item.user}</td>

<td>${item.activity}</td>

<td>${item.date}</td>

<td>${item.time}</td>

<td>

<span class="badge-success">

${item.status}

</span>

</td>

</tr>

`;

});

document.getElementById("totalActivities").innerHTML=activities.length;

document.getElementById("todayActivities").innerHTML=activities.length;

document.getElementById("navigationCount").innerHTML=
activities.filter(x=>x.activity=="Started Navigation").length;

document.getElementById("feedbackCount").innerHTML=
activities.filter(x=>x.activity=="Submitted Feedback").length;

}

// =====================================
// SEARCH + FILTER
// =====================================

function searchActivity(){

let search=document
.getElementById("search")
.value
.toLowerCase();

let filter=document
.getElementById("activityFilter")
.value;

let rows=document.querySelectorAll("#activityTable tr");

rows.forEach(row=>{

let text=row.innerText.toLowerCase();

let activity=row.children[2].innerText;

let show=true;

if(search && !text.includes(search))
show=false;

if(filter && activity!==filter)
show=false;

row.style.display=show?"":"none";

});

}

// =====================================
// EXPORT CSV
// =====================================

function exportCSV(){

let csv="User,Activity,Date,Time,Status\n";

activities.forEach(item=>{

csv+=`${item.user},${item.activity},${item.date},${item.time},${item.status}\n`;

});

let blob=new Blob([csv],{type:"text/csv"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="user-activities.csv";

a.click();

URL.revokeObjectURL(url);

}

// =====================================
// LOGOUT
// =====================================

function logout(){

if(confirm("Logout from Admin Panel?")){

window.location.href="admin.html";

}

}

// =====================================
// LOAD PAGE
// =====================================

window.onload=loadActivities;

</script>

</body>

</html>
