<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7fb;
}

.wrapper{
display:flex;
}

/* Sidebar */

.sidebar{
width:250px;
background:#0d6efd;
color:white;
height:100vh;
position:fixed;
padding-top:20px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar ul li{
padding:15px 25px;
transition:.3s;
}

.sidebar ul li:hover{
background:#084298;
}

.sidebar ul li.active{
background:white;
}

.sidebar ul li.active a{
color:#0d6efd;
font-weight:bold;
}

.sidebar ul li a{
color:white;
text-decoration:none;
display:block;
}

/* Main */

.main{
margin-left:250px;
padding:30px;
width:100%;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.card-box{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card-box h3{
font-size:35px;
color:#0d6efd;
}

.search-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:25px;
}

.table-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.status-online{
background:#198754;
color:white;
padding:5px 12px;
border-radius:20px;
font-size:12px;
}

.status-offline{
background:#dc3545;
color:white;
padding:5px 12px;
border-radius:20px;
font-size:12px;
}

@media(max-width:900px){

.cards{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:768px){

.sidebar{
display:none;
}

.main{
margin-left:0;
}

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="wrapper">

<div class="sidebar">

<h2>🛕 Admin</h2>

<ul>

<li>
<a href="admin.html">
<i class="fa fa-home"></i>
Dashboard
</a>
</li>

<li>
<a href="user-management.html">
<i class="fa fa-users"></i>
User Management
</a>
</li>

<li class="active">
<a href="#">
<i class="fa fa-clock"></i>
Login History
</a>
</li>

<li>
<a href="user-activities.html">
<i class="fa fa-chart-line"></i>
User Activities
</a>
</li>


</ul>

</div>

<div class="main">

<div class="header">

<h2>Login History</h2>

<button class="btn btn-danger" onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</button>

</div>

<div class="cards">

<div class="card-box">

<h3 id="totalLogins">0</h3>

<p>Total Logins</p>

</div>

<div class="card-box">

<h3 id="todayLogins">0</h3>

<p>Today's Logins</p>

</div>

<div class="card-box">

<h3 id="onlineUsers">0</h3>

<p>Users Online</p>

</div>

<div class="card-box">

<h3 id="failedLogins">0</h3>

<p>Failed Logins</p>

</div>

</div>

<div class="search-box">

<div class="row">

<div class="col-md-4">

<input
type="text"
id="search"
class="form-control"
placeholder="Search User">

</div>

<div class="col-md-3">

<input
type="date"
id="dateFilter"
class="form-control">

</div>

<div class="col-md-5 text-end">

<button class="btn btn-primary" onclick="searchHistory()">

<i class="fa fa-search"></i>

Search

</button>

<button class="btn btn-success">

<i class="fa fa-file-export"></i>

Export CSV

</button>

</div>

</div>

</div>

<div class="table-box">

<h4 class="mb-3">

Login Records

</h4>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>#</th>

<th>User</th>

<th>Email</th>

<th>Login Time</th>

<th>Logout Time</th>

<th>Device</th>

<th>Browser</th>

<th>Status</th>

</tr>

</thead>

<tbody id="historyTable">
</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// ==============================
// SAMPLE LOGIN HISTORY
// ==============================

let loginHistory = [

{
user:"Deepthi",
email:"deepthi@gmail.com",
login:"29-07-2026 09:10 AM",
logout:"29-07-2026 10:45 AM",
device:"Windows 11",
browser:"Chrome",
status:"Offline"
},

{
user:"Rahul",
email:"rahul@gmail.com",
login:"29-07-2026 10:15 AM",
logout:"--",
device:"Android",
browser:"Chrome",
status:"Online"
},

{
user:"Priya",
email:"priya@gmail.com",
login:"29-07-2026 11:30 AM",
logout:"29-07-2026 12:20 PM",
device:"Windows 10",
browser:"Edge",
status:"Offline"
},

{
user:"Kumar",
email:"kumar@gmail.com",
login:"29-07-2026 01:00 PM",
logout:"--",
device:"Laptop",
browser:"Firefox",
status:"Online"
}

];

// ==============================
// LOAD TABLE
// ==============================

function loadHistory(){

let table=document.getElementById("historyTable");

table.innerHTML="";

loginHistory.forEach((item,index)=>{

table.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${item.user}</td>

<td>${item.email}</td>

<td>${item.login}</td>

<td>${item.logout}</td>

<td>${item.device}</td>

<td>${item.browser}</td>

<td>

<span class="${
item.status=="Online"
?
"status-online"
:
"status-offline"
}">

${item.status}

</span>

</td>

</tr>

`;

});

document.getElementById("totalLogins").innerHTML=loginHistory.length;

document.getElementById("todayLogins").innerHTML=loginHistory.length;

document.getElementById("onlineUsers").innerHTML=
loginHistory.filter(x=>x.status=="Online").length;

document.getElementById("failedLogins").innerHTML=0;

}

// ==============================
// SEARCH USER
// ==============================

function searchHistory(){

let value=document
.getElementById("search")
.value
.toLowerCase();

let rows=document.querySelectorAll("#historyTable tr");

rows.forEach(row=>{

row.style.display=row.innerText.toLowerCase().includes(value)
?
""
:
"none";

});

}

// ==============================
// LOGOUT
// ==============================

function logout(){

if(confirm("Logout from Admin Panel?")){

window.location.href="admin.html";

}

}

// ==============================
// EXPORT CSV
// ==============================

document.querySelector(".btn-success").addEventListener("click",function(){

let csv="User,Email,Login,Logout,Device,Browser,Status\n";

loginHistory.forEach(item=>{

csv+=`${item.user},${item.email},${item.login},${item.logout},${item.device},${item.browser},${item.status}\n`;

});

let blob=new Blob([csv],{type:"text/csv"});

let url=window.URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="login-history.csv";

a.click();

});

// ==============================
// PAGE LOAD
// ==============================

window.onload=loadHistory;

</script>

</body>

</html>
