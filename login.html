<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="overlay">

<div class="auth-box">

<form id="loginForm">

<h1>Login</h1>

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<div class="password-box">

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<span class="eye" onclick="toggleLoginPassword()">
👁️
</span>

</div>

<button type="submit">
Login
</button>
<p style="margin-top:15px;">
<a href="#" onclick="openForgotPopup()" style="color:#007bff;font-weight:bold;text-decoration:none;">
Forgot Password?
</a>
</p>

<p style="margin-top:15px;">
New user?
<a href="signup.html" style="color:#007bff;font-weight:bold;">
Signup
</a>
</p>

</form>

</div>

</div>


<!-- Forgot Password Popup -->

<div id="forgotPopup" class="popup">

<div class="popup-content">

<span class="close" onclick="closeForgotPopup()">&times;</span>

<h2>Reset Password</h2>

<input
type="email"
id="forgotEmail"
placeholder="Registered Gmail">

<input
type="tel"
id="forgotPhone"
placeholder="Registered Mobile Number">

<select id="otpMethod">

<option value="">Select OTP Method</option>

<option value="email">Email OTP</option>

<option value="sms">SMS OTP</option>

</select>

<button type="button" onclick="sendOTP()">
Send OTP
</button>

<input
type="text"
id="otp"
placeholder="Enter OTP">
<button type="button" onclick="verifyOTP()">
Verify OTP
</button>

<div id="resetSection" style="display:none;">

<input
type="password"
id="newPassword"
placeholder="New Password">

<input
type="password"
id="confirmNewPassword"
placeholder="Confirm Password">

<button type="button" onclick="resetPassword()">
Reset Password
</button>

</div>

</div>

</div>

<script src="js/auth.js"></script>
</body>
</html>
